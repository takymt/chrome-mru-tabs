pre-commit:
  jobs:
    - name: format
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,md,yaml,yml}"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}"
      run: pnpm exec oxlint --deny-warnings --no-error-on-unmatched-pattern {staged_files}

commit-msg:
  jobs:
    - name: conventional-commits
      run: bash scripts/commit-msg.sh {1}
